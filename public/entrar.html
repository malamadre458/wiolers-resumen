<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Resumen de Discord</title>
<link rel="stylesheet" href="/estilos.css">
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card { width: min(400px, 100%); padding: 30px 26px; text-align: center; }
  .card svg { margin-bottom: 14px; }
  h1 { margin: 0 0 4px; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .sub { color: var(--soft); font-size: 14px; margin: 0 0 22px; }
  form { display: grid; gap: 12px; text-align: left; }
  label { color: var(--soft); font-size: 13px; font-weight: 600; }
  .err:empty { display: none; }
  .btn { width: 100%; padding: 12px; }
  .sig { color: #55576a; font-size: 12px; margin-top: 18px; }
</style>
</head>
<body>
<div class="wrap">
  <main class="box card">
    <svg width="44" height="44" viewBox="0 0 30 30" aria-hidden="true"><rect width="30" height="30" rx="9" fill="#5865f2"/><path d="M8 10.5h14M8 15h14M8 19.5h8" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>Resumen de Discord</h1>
    <p class="sub">Escribe la contraseña para entrar.</p>
    <form method="post" action="/entrar">
      <input type="hidden" name="next" id="next">
      <label for="pw">Contraseña</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" autofocus required>
      <div class="err" id="err"></div>
      <button class="btn primary" type="submit">Entrar</button>
    </form>
    <div class="sig">AXFL</div>
  </main>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '/';
  const e = q.get('error');
  if (e === 'espera') document.getElementById('err').textContent = 'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  else if (e) document.getElementById('err').textContent = 'La contraseña no es correcta.';
</script>
</body>
</html>
