<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar · Resumen de Discord</title>
<link rel="stylesheet" href="/fuentes/fuentes.css">
<link rel="stylesheet" href="/estilos.css">
<style>
  .wrap { min-height: 100vh; display: grid; place-items: center; padding: 16px; position: relative; z-index: 1; }
  .card { width: min(420px, 100%); text-align: center; border-width: 4px; border-color: var(--outline);
          box-shadow: 0 0 0 4px #fff, 0 0 40px rgba(255,170,220,.6), 0 0 80px rgba(170,140,240,.35); }
  .title { font-size: 34px; margin-bottom: 4px; }
  form { display: grid; gap: 12px; margin-top: 22px; text-align: left; }
  label { font-weight: 800; font-size: 13px; color: var(--mut); }
  .err { color: #d6337a; font-weight: 800; font-size: 14px; min-height: 18px; }
  .heart { color: var(--pink-2); }
</style>
</head>
<body>
<div class="wrap">
  <div class="box card">
    <h1 class="title">Resumen <span class="p">de</span> <span class="s">Discord</span></h1>
    <div class="sig">AXFL</div>
    <form method="post" action="/entrar">
      <input type="hidden" name="next" id="next">
      <label for="pw">Contraseña</label>
      <input type="password" id="pw" name="password" autocomplete="current-password" autofocus required>
      <div class="err" id="err"></div>
      <button class="btn primary" type="submit">Entrar <span class="heart">♥</span></button>
    </form>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('next').value = q.get('next') || '/';
  const e = q.get('error');
  if (e === 'espera') document.getElementById('err').textContent = 'Demasiados intentos. Espera unos minutos y vuelve a probar.';
  else if (e) document.getElementById('err').textContent = 'Contraseña incorrecta.';
</script>
</body>
</html>
